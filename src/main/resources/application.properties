# Database connection properties
# Spring will automatically configure JPA and Hibernate based on these settings
# The host 'db' is resolvable within the docker-compose network
spring.datasource.url=jdbc:postgresql://db:5432/taskdb
spring.datasource.username=taskuser
spring.datasource.password=taskpassword
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA and Hibernate properties
# ddl-auto: 'update' will update the schema automatically. Other options include 'create', 'create-drop', 'validate', 'none'.
# hibernate.ddl-auto: 'update' is useful for development, but for production, use migrations (e.g., Liquibase or Flyway).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true # Log SQL statements to the console
spring.jpa.properties.hibernate.format_sql=true # Format SQL statements for better readability
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect # Specify the PostgreSQL dialect
